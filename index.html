<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Performance Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fed">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#657083;--bd:#e3e7ee;--ac:#2f6fed;--ok:#1f9d63}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a3b5;--bd:#2b3340;--ac:#5b92ff;--ok:#3ac084}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}@media(max-width:720px){.app{grid-template-columns:1fr}}
aside{background:var(--card);border-right:1px solid var(--bd);padding:16px}main{padding:20px;max-width:900px;width:100%}
h1{font-size:17px;margin:0 0 4px}h2{font-size:20px;margin:0}h3{font-size:13px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.mu{color:var(--mu);font-size:13px}
.emp{display:block;width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:8px;background:none;color:inherit;cursor:pointer;font:inherit}
.emp:hover,.emp.on{background:var(--bg)}.emp.on{border-color:var(--ac)}.emp b{display:block}
input,textarea,select,button{font:inherit;color:var(--tx)}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:4px 0}
textarea{min-height:70px;resize:vertical}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin-top:4px}
.b.g{background:none;color:var(--mu);border:1px solid var(--bd)}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat b{font-size:22px;display:block}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>input,.row>textarea{flex:1}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);margin-bottom:8px}
.msg.me{margin-left:auto;background:var(--ac);color:#fff;border-color:var(--ac)}.msg.me .mu{color:#dbe6ff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.sc{overflow-x:auto}.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;color:#fff}.pill.ok{background:var(--ok)}.pill.no{background:#d9534f}
.callbar{position:sticky;top:0;z-index:20;background:#1c2430;color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.callbar .b{margin:0}.callbar .no{background:#d9534f}
.err{background:#fde8e8;color:#8a1f1f;padding:10px;border-radius:8px;margin-bottom:10px}
#inst{display:none;position:fixed;right:16px;bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
</style>
</head>
<body>
<div id="root"></div>
<button class="b" id="inst">Install app</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;document.getElementById('inst').style.display='block'});
document.getElementById('inst').onclick=function(){if(dp){dp.prompt();dp=null;this.style.display='none'}};
window.addEventListener('appinstalled',function(){document.getElementById('inst').style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
var sb=supabase.createClient(CFG.url,CFG.key);
var mt=[],dir=[],inc=null,out=null,dismissed={},lastKey='',view='person',per='week',off=0,deals=[],me=null,isMgr=false,people=[],names={},sel=null,tab='overview',D={goals:[],reports:[],msgs:[],notes:[]},err='',mode='in',sub=null;
var root=document.getElementById('root');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(t){return new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function nm(id){return id===me.id?'You':(names[id]||'Teammate')}
function val(k){var e=document.querySelector('[data-k="'+k+'"]');return e?e.value.trim():''}
function clr(k){var e=document.querySelector('[data-k="'+k+'"]');if(e)e.value=''}
var keep={};
function snap(){keep={};document.querySelectorAll('[data-k]').forEach(function(e){keep[e.dataset.k]=e.value});var a=document.activeElement;keep._f=a&&a.dataset&&a.dataset.k}
function restore(){document.querySelectorAll('[data-k]').forEach(function(e){if(keep[e.dataset.k]!=null)e.value=keep[e.dataset.k];if(keep._f&&e.dataset.k===keep._f)e.focus()})}
function fail(r){if(r&&r.error){err=r.error.message;render()}return r}

sb.auth.onAuthStateChange(function(ev,s){if(ev==='SIGNED_OUT'){me=null;render()}else if(s&&(!me||me.id!==s.user.id))boot(s.user)});
sb.auth.getSession().then(function(r){if(r.data.session)boot(r.data.session.user);else render()});

async function boot(u){
  var p=await sb.from('profiles').select('*').eq('id',u.id).single();
  if(p.error){err=p.error.message;render();return}
  me=p.data;isMgr=me.role==='manager';
  var all=await sb.from('profiles').select('*').order('full_name');
  people=all.data||[];people.forEach(function(x){names[x.id]=x.full_name||'Teammate'});
  var dr=await sb.from('directory').select('*').order('full_name');dir=dr.data||[];dir.forEach(function(x){names[x.id]=x.full_name||'Teammate'});
  if(!isMgr)people=[me];
  sel=sel&&people.some(function(x){return x.id===sel})?sel:people[0].id;
  await load();
  if(!sub)sub=sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},function(p){if(p&&p.table==='calls')pollCalls();else load()}).subscribe();
  pollCalls();if(!window._cp)window._cp=setInterval(pollCalls,15000);
}
async function load(){
  var q=function(t){return sb.from(t).select('*').eq('employee_id',sel).order('created_at')};
  var r=await Promise.all([q('goals'),q('reports'),q('messages'),isMgr?q('notes'):Promise.resolve({data:[]}),sb.from('deals').select('*').order('created_at',{ascending:false}).limit(1000),sb.from('meetings').select('*').order('created_at',{ascending:false}).limit(60)]);
  mt=r[5].data||[];
  D={goals:r[0].data||[],reports:r[1].data||[],msgs:r[2].data||[],notes:r[3].data||[]};deals=r[4].data||[];
  if(r[4].error)err='Sales data could not load. Did you run update.sql in Supabase? ('+r[4].error.message+')';
  if(r[5].error&&!err)err='Meetings could not load. Did you run calls-update.sql in Supabase? ('+r[5].error.message+')';
  render();
}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function peso(n){return '\u20B1'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0})}
function range(){
  var n=new Date(),a,b,lbl;
  if(per==='week'){var dow=(n.getDay()+6)%7;a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+off*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
    lbl=a.toLocaleDateString([],{month:'short',day:'numeric'})+' \u2013 '+b.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})}
  else{a=new Date(n.getFullYear(),n.getMonth()+off,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);lbl=a.toLocaleDateString([],{month:'long',year:'numeric'})}
  return {a:ymd(a),b:ymd(b),lbl:lbl};
}
function render0(){
  snap();
  if(!me){root.innerHTML=loginView();restore();return}
  var h='<div class="app"><aside><h1>Team Tracker</h1><div class="mu">'+esc(me.full_name)+' \u00B7 '+(isMgr?'Manager':'Team member')+'</div><button class="b g" data-a="out" style="margin:8px 0">Sign out</button>'
   +'<button class="emp'+(view==='dash'?' on':'')+'" data-a="dash"><b>Sales dashboard</b><span class="mu">Weekly &amp; monthly</span></button><button class="emp'+(view==='meet'?' on':'')+'" data-a="meet"><b>Meetings &amp; calls</b><span class="mu">Video &amp; voice</span></button><h3>Team</h3>';
  people.forEach(function(p){h+='<button class="emp'+(view==='person'&&p.id===sel?' on':'')+'" data-a="sel" data-id="'+p.id+'"><b>'+esc(p.full_name||'Unnamed')+'</b><span class="mu">'+esc(p.job_title||p.role)+'</span></button>'});
  h+='</aside><main>'+(err?'<div class="err">'+esc(err)+'</div>':'');
  if(view==='meet'){root.innerHTML=h+vMeet()+'</main></div>';restore();return}
  if(view==='dash'){root.innerHTML=h+vDash()+'</main></div>';restore();return}
  var e=people.filter(function(p){return p.id===sel})[0];
  if(!e){root.innerHTML=h+'</main></div>';return}
  var tabs=[['overview','Overview'],['deals','Deals'],['reports','Reports'],['messages','Messages']];if(isMgr)tabs.push(['notes','Private notes']);
  if(!tabs.some(function(t){return t[0]===tab}))tab='overview';
  h+='<h2>'+esc(e.full_name)+'</h2><div class="mu">'+esc(e.job_title||'No job title set')+'</div><div class="tabs">'+tabs.map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" data-a="tab" data-id="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
  h+=({overview:vOverview,deals:vDeals,reports:vReports,messages:vMsgs,notes:vNotes}[tab])(e);
  root.innerHTML=h+'</main></div>';restore();
}

function render(){render0();var b=me?callBar():'';if(b)root.insertAdjacentHTML('afterbegin',b)}
function rid(){var a=new Uint8Array(8);crypto.getRandomValues(a);return 'MotoTeam-'+Array.prototype.map.call(a,function(x){return x.toString(36).padStart(2,'0')}).join('')}
function meetUrl(room,kind){return 'https://meet.jit.si/'+room+'#userInfo.displayName='+encodeURIComponent('"'+(me.full_name||'Team member')+'"')+(kind==='audio'?'&config.startWithVideoMuted=true':'')}
function openRoom(room,kind){window.open(meetUrl(room,kind),'_blank','noopener')}
async function pollCalls(){
  if(!me)return;
  var r=await sb.from('calls').select('*').gte('created_at',new Date(Date.now()-120000).toISOString()).order('created_at',{ascending:false}).limit(20);
  if(r.error)return;
  var c=r.data||[],n=Date.now();
  inc=c.filter(function(x){return x.callee_id===me.id&&x.status==='ringing'&&n-new Date(x.created_at)<60000})[0]||null;
  var o=c.filter(function(x){return x.caller_id===me.id})[0]||null;
  out=o&&n-new Date(o.created_at)<90000&&o.status!=='ended'&&!dismissed[o.id]?o:null;
  var k=(inc?inc.id+inc.status:'')+'|'+(out?out.id+out.status:'');
  if(k!==lastKey){lastKey=k;render()}
}
function callBar(){
  if(inc)return '<div class="callbar"><b>'+esc(names[inc.caller_id]||'A teammate')+'</b> is '+(inc.kind==='audio'?'calling you':'video calling you')+'<button class="b" data-a="accept">Accept</button><button class="b no" data-a="decline">Decline</button></div>';
  if(out){
    var w=esc(names[out.callee_id]||'your teammate');
    if(out.status==='ringing')return '<div class="callbar">Calling <b>'+w+'</b>\u2026 <button class="b no" data-a="cancelcall">Cancel</button></div>';
    if(out.status==='accepted')return '<div class="callbar"><b>'+w+'</b> accepted your call <button class="b" data-a="reopen">Open call</button><button class="b g" data-a="okcall">Dismiss</button></div>';
    if(out.status==='declined')return '<div class="callbar"><b>'+w+'</b> declined the call <button class="b g" data-a="okcall">OK</button></div>';
  }
  return '';
}
function vMeet(){
  var h='<h2>Meetings &amp; calls</h2><p class="mu">Meetings and calls open in a new tab and work on phones and computers. Allow your camera and microphone when the browser asks.</p>';
  h+='<h3>Start or schedule a meeting</h3><div class="card"><input data-k="mtt" placeholder="Meeting title (e.g. Monday sales huddle)"><input data-k="mts" type="datetime-local"><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="b" data-a="meetNow">Start meeting now</button><button class="b g" data-a="meetSched">Schedule for the time above</button></div></div>';
  var n=Date.now(),list=mt.filter(function(m){return m.scheduled_at?new Date(m.scheduled_at).getTime()>n-7200000:new Date(m.created_at).getTime()>n-86400000});
  list.sort(function(a,b){return new Date(b.scheduled_at||b.created_at)-new Date(a.scheduled_at||a.created_at)});
  h+='<h3>Upcoming &amp; recent meetings</h3>';
  list.forEach(function(m){h+='<div class="card"><div class="row"><b>'+esc(m.title)+'</b><span class="mu">'+(m.scheduled_at?'Scheduled '+fmt(m.scheduled_at):'Started '+fmt(m.created_at))+'</span></div><div class="mu">Host: '+esc(nm2(m.created_by))+'</div><div class="row" style="justify-content:flex-start;margin-top:6px"><button class="b" data-a="joinm" data-id="'+m.id+'">Join</button>'+((m.created_by===me.id||isMgr)?'<button class="b g" data-a="delm" data-id="'+m.id+'">Delete</button>':'')+'</div></div>'});
  if(!list.length)h+='<p class="mu">No meetings yet.</p>';
  h+='<h3>Call a teammate</h3>';
  var others=dir.filter(function(p){return p.id!==me.id});
  others.forEach(function(p){h+='<div class="card"><div class="row"><div><b>'+esc(p.full_name||'Unnamed')+'</b><div class="mu">'+esc(p.job_title||'')+'</div></div><div style="display:flex;gap:6px"><button class="b g" data-a="callu" data-id="'+p.id+'" data-kind="audio">Voice call</button><button class="b" data-a="callu" data-id="'+p.id+'" data-kind="video">Video call</button></div></div></div>'});
  if(!others.length)h+='<p class="mu">Teammates appear here after they sign up. If this stays empty, make sure you ran calls-update.sql in Supabase.</p>';
  return h;
}
function nm2(id){return id===me.id?'You':(names[id]||'Teammate')}
function dealCard(d,showWho,canClose){
  var ok=d.status==='closed';
  return '<div class="card"><div class="row"><b>'+esc(d.customer)+(d.model?' \u00B7 '+esc(d.model):'')+'</b><span class="pill '+(ok?'ok':'no')+'">'+(ok?'Closed '+peso(d.amount):'Not closed')+'</span></div>'
   +'<div class="mu">'+(showWho?esc(names[d.employee_id]||'Teammate')+' \u00B7 ':'')+esc(d.deal_date)+'</div>'
   +(d.reason?'<p style="white-space:pre-wrap;margin:8px 0 0"><span class="mu">Reason not closed:</span> '+esc(d.reason)+'</p>':'')
   +(!ok&&canClose?'<div class="row" style="margin-top:8px"><input type="number" min="0" data-k="am_'+d.id+'" placeholder="Sale amount (\u20B1) if now closed"><button class="b" data-a="close" data-id="'+d.id+'">Mark as closed</button></div>':'')+'</div>';
}
function vDeals(e){
  var today=ymd(new Date());
  var h='<div class="card"><b>Log a deal</b><input data-k="dc" placeholder="Customer name"><input data-k="dm" placeholder="Motorcycle model"><select data-k="ds"><option value="closed">Sale closed</option><option value="not_closed">Not closed</option></select><input data-k="da" type="number" min="0" placeholder="Sale amount (\u20B1) \u2013 for closed sales"><textarea data-k="dr" placeholder="Reason (required when the sale was NOT closed)"></textarea><input data-k="dd" type="date" value="'+today+'"><button class="b" data-a="addDeal">Save deal</button></div>';
  var mine=deals.filter(function(d){return d.employee_id===e.id});
  var c=mine.filter(function(d){return d.status==='closed'}).length;
  h+='<p class="mu">'+c+' closed \u00B7 '+(mine.length-c)+' not closed</p>';
  mine.sort(function(a,b){return a.deal_date<b.deal_date?1:-1}).forEach(function(d){h+=dealCard(d,false,true)});
  return h;
}
function vDash(){
  var R=range(),inR=deals.filter(function(d){return d.deal_date>=R.a&&d.deal_date<=R.b});
  var assoc=people.filter(function(p){return p.role==='employee'||inR.some(function(d){return d.employee_id===p.id})});
  var rows=assoc.map(function(p){
    var mine=inR.filter(function(d){return d.employee_id===p.id}),cl=mine.filter(function(d){return d.status==='closed'});
    var tg=per==='week'?p.weekly_target:p.monthly_target;
    return {p:p,units:cl.length,rev:cl.reduce(function(a,d){return a+Number(d.amount||0)},0),nc:mine.length-cl.length,tg:tg||0};
  }).sort(function(a,b){return b.rev-a.rev});
  var tU=0,tR=0,tN=0;rows.forEach(function(r){tU+=r.units;tR+=r.rev;tN+=r.nc});
  var rate=(tU+tN)?Math.round(tU/(tU+tN)*100):0;
  var h='<h2>Sales dashboard</h2><div class="seg"><button class="tab'+(per==='week'?' on':'')+'" data-a="per" data-id="week">Weekly</button><button class="tab'+(per==='month'?' on':'')+'" data-a="per" data-id="month">Monthly</button>'
   +'<button class="b g" data-a="nav" data-id="-1">\u25C0</button><b>'+esc(R.lbl)+'</b><button class="b g" data-a="nav" data-id="1">\u25B6</button><button class="b g" data-a="nav" data-id="0">'+(per==='week'?'This week':'This month')+'</button></div>';
  h+='<div class="stats"><div class="card stat"><b>'+tU+'</b><span class="mu">Bikes sold</span></div><div class="card stat"><b>'+peso(tR)+'</b><span class="mu">Total sales</span></div><div class="card stat"><b>'+tN+'</b><span class="mu">Not closed</span></div><div class="card stat"><b>'+rate+'%</b><span class="mu">Close rate</span></div></div>';
  h+='<h3>Sales by marketing associate</h3><div class="card sc"><table><tr><th>Associate</th><th>Sold</th><th>Sales</th>'+(isMgr?'<th>% of team</th>':'')+'<th>Not closed</th><th>Target progress</th></tr>';
  rows.forEach(function(r){
    var sh=tR?Math.round(r.rev/tR*100):0,tp=r.tg?Math.round(r.units/r.tg*100):null;
    h+='<tr><td><b>'+esc(r.p.full_name||'Unnamed')+'</b></td><td>'+r.units+'</td><td>'+peso(r.rev)+'</td>'+(isMgr?'<td>'+sh+'%</td>':'')+'<td>'+r.nc+'</td><td style="min-width:150px">'+(tp===null?'<span class="mu">No target set</span>':r.units+' / '+r.tg+' ('+tp+'%)<div class="bar"><i style="width:'+Math.min(tp,100)+'%"></i></div>')+'</td></tr>';
  });
  if(!rows.length)h+='<tr><td colspan="6" class="mu">No team members yet.</td></tr>';
  else if(isMgr)h+='<tr><td><b>Team total</b></td><td><b>'+tU+'</b></td><td><b>'+peso(tR)+'</b></td><td><b>100%</b></td><td><b>'+tN+'</b></td><td></td></tr>';
  h+='</table></div><p class="mu">Weekly targets use Monday\u2013Sunday. Targets are counted in bikes sold and set per person on their Overview page.</p>';
  var nc=inR.filter(function(d){return d.status!=='closed'}).sort(function(a,b){return a.deal_date<b.deal_date?1:-1});
  h+='<h3>Deals not closed ('+nc.length+')</h3>';
  nc.forEach(function(d){h+=dealCard(d,isMgr,false)});
  if(!nc.length)h+='<p class="mu">No unclosed deals in this period.</p>';
  return h;
}
function loginView(){
  return '<div class="login"><h1>Team Performance Tracker</h1><p class="mu">'+(mode==='in'?'Sign in to continue.':'Create your account. The very first account becomes the manager.')+'</p>'+(err?'<div class="err">'+esc(err)+'</div>':'')
   +(mode==='up'?'<input data-k="fn" placeholder="Full name">':'')+'<input data-k="em" type="email" placeholder="Email"><input data-k="pw" type="password" placeholder="Password (min 6 characters)">'
   +'<button class="b" data-a="'+(mode==='in'?'login':'signup')+'">'+(mode==='in'?'Sign in':'Create account')+'</button> <button class="b g" data-a="mode">'+(mode==='in'?'Need an account?':'I have an account')+'</button></div>';
}
function vOverview(e){
  var rs=D.reports,g=D.goals;
  var rated=rs.filter(function(r){return r.rating});
  var avg=rated.length?(rated.reduce(function(a,r){return a+r.rating},0)/rated.length).toFixed(1):'–';
  var gp=g.length?Math.round(g.reduce(function(a,x){return a+x.pct},0)/g.length):0;
  var h='<div class="stats"><div class="card stat"><b>'+rs.length+'</b><span class="mu">Reports</span></div><div class="card stat"><b>'+avg+'</b><span class="mu">Avg self-rating</span></div><div class="card stat"><b>'+gp+'%</b><span class="mu">Goal progress</span></div></div>';
  if(isMgr)h+='<div class="row card"><input data-k="jt" placeholder="Job title" value="'+esc(e.job_title)+'"><button class="b" data-a="title">Save title</button>'+(e.id!==me.id?'<button class="b g" data-a="role">'+(e.role==='manager'?'Make employee':'Make manager')+'</button>':'')+'</div>';
  if(isMgr)h+='<div class="row card"><input type="number" min="0" data-k="tw" placeholder="Weekly target (bikes)" value="'+(e.weekly_target||'')+'"><input type="number" min="0" data-k="tm" placeholder="Monthly target (bikes)" value="'+(e.monthly_target||'')+'"><button class="b" data-a="targets">Save targets</button></div>';
  h+='<h3>Goals</h3>';
  g.forEach(function(x){h+='<div class="card"><div class="row"><b>'+esc(x.text)+'</b><span class="mu">'+x.pct+'%</span></div><div class="bar"><i style="width:'+x.pct+'%"></i></div>'+(isMgr?'<input type="range" min="0" max="100" step="5" value="'+x.pct+'" data-a="pct" data-id="'+x.id+'">':'')+'</div>'});
  if(!g.length)h+='<p class="mu">No goals yet.</p>';
  if(isMgr)h+='<div class="row"><input data-k="goal" placeholder="New goal"><button class="b" data-a="addGoal">Add goal</button></div>';
  return h;
}
function vReports(e){
  var h='<div class="card"><b>Submit a report</b><input data-k="rt" placeholder="Title (e.g. Weekly report)"><textarea data-k="rb" placeholder="What you worked on, results, blockers…"></textarea><select data-k="rr"><option value="">Self-rating (1–5)</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button class="b" data-a="addReport">Submit</button></div>';
  D.reports.slice().reverse().forEach(function(r){h+='<div class="card"><div class="row"><b>'+esc(r.title)+'</b>'+(r.rating?'<span class="mu">'+r.rating+'/5</span>':'')+'</div><div class="mu">'+esc(nm(r.author_id))+' · '+fmt(r.created_at)+'</div><p style="white-space:pre-wrap;margin:8px 0 0">'+esc(r.body)+'</p></div>'});
  return h;
}
function vMsgs(){
  var h='';D.msgs.forEach(function(x){h+='<div class="msg'+(x.author_id===me.id?' me':'')+'"><div class="mu">'+esc(nm(x.author_id))+' · '+fmt(x.created_at)+'</div>'+esc(x.text).replace(/\n/g,'<br>')+'</div>'});
  return (h||'<p class="mu">No messages yet.</p>')+'<div class="row"><textarea data-k="mt" placeholder="Write a message…"></textarea><button class="b" data-a="addMsg">Send</button></div>';
}
function vNotes(){
  var h='<p class="mu">Only managers can see these.</p><div class="card"><textarea data-k="nt" placeholder="Private note…"></textarea><button class="b" data-a="addNote">Save note</button></div>';
  D.notes.slice().reverse().forEach(function(n){h+='<div class="card"><div class="mu">'+esc(nm(n.author_id))+' · '+fmt(n.created_at)+'</div><p style="white-space:pre-wrap;margin:6px 0 0">'+esc(n.text)+'</p></div>'});
  return h;
}

document.addEventListener('click',async function(ev){
  var t=ev.target.closest('[data-a]');if(!t||t.type==='range')return;var a=t.dataset.a;err='';
  if(a==='mode'){mode=mode==='in'?'up':'in';render()}
  else if(a==='login'){var r=await sb.auth.signInWithPassword({email:val('em'),password:val('pw')});if(r.error){err=r.error.message;render()}}
  else if(a==='signup'){var r=await sb.auth.signUp({email:val('em'),password:val('pw'),options:{data:{full_name:val('fn')}}});if(r.error){err=r.error.message;render()}else if(!r.data.session){err='Check your email to confirm your account, then sign in.';mode='in';render()}}
  else if(a==='out'){sb.auth.signOut()}
  else if(a==='sel'){sel=t.dataset.id;view='person';await load()}
  else if(a==='dash'){view='dash';render()}
  else if(a==='meet'){view='meet';render()}
  else if(a==='meetNow'||a==='meetSched'){
    var ti=val('mtt')||'Team meeting',sc=val('mts');
    if(a==='meetSched'&&!sc){err='Pick a date and time to schedule.';render();return}
    var room=rid();if(a==='meetNow')openRoom(room,'video');
    fail(await sb.from('meetings').insert({title:ti,room:room,scheduled_at:a==='meetSched'?new Date(sc).toISOString():null}));clr('mtt');clr('mts');load()}
  else if(a==='joinm'){var m=mt.filter(function(x){return x.id===t.dataset.id})[0];if(m)openRoom(m.room,'video')}
  else if(a==='delm'){fail(await sb.from('meetings').delete().eq('id',t.dataset.id));load()}
  else if(a==='callu'){
    var room2=rid(),kind=t.dataset.kind;openRoom(room2,kind);
    fail(await sb.from('calls').insert({callee_id:t.dataset.id,room:room2,kind:kind}));pollCalls()}
  else if(a==='accept'&&inc){openRoom(inc.room,inc.kind);var id1=inc.id;inc=null;await sb.from('calls').update({status:'accepted'}).eq('id',id1);lastKey='';pollCalls()}
  else if(a==='decline'&&inc){var id2=inc.id;inc=null;await sb.from('calls').update({status:'declined'}).eq('id',id2);lastKey='';pollCalls()}
  else if(a==='cancelcall'&&out){var id3=out.id;dismissed[id3]=1;out=null;await sb.from('calls').update({status:'ended'}).eq('id',id3);lastKey='';render()}
  else if(a==='reopen'&&out){openRoom(out.room,out.kind)}
  else if(a==='okcall'&&out){dismissed[out.id]=1;out=null;lastKey='';render()}
  else if(a==='per'){per=t.dataset.id;off=0;render()}
  else if(a==='nav'){off=t.dataset.id==='0'?0:off+(+t.dataset.id);render()}
  else if(a==='tab'){tab=t.dataset.id;render()}
  else if(a==='title'){fail(await sb.from('profiles').update({job_title:val('jt')}).eq('id',sel));await boot(me)}
  else if(a==='role'){var p=people.filter(function(x){return x.id===sel})[0];fail(await sb.from('profiles').update({role:p.role==='manager'?'employee':'manager'}).eq('id',sel));await boot(me)}
  else if(a==='addGoal'){var g=val('goal');if(g){clr('goal');fail(await sb.from('goals').insert({employee_id:sel,text:g}));load()}}
  else if(a==='addReport'){var ti=val('rt'),b=val('rb');if(ti&&b){var rt=val('rr');clr('rt');clr('rb');clr('rr');fail(await sb.from('reports').insert({employee_id:sel,title:ti,body:b,rating:rt?+rt:null}));load()}}
  else if(a==='addMsg'){var m=val('mt');if(m){clr('mt');fail(await sb.from('messages').insert({employee_id:sel,text:m}));load()}}
  else if(a==='targets'){fail(await sb.from('profiles').update({weekly_target:parseInt(val('tw'))||0,monthly_target:parseInt(val('tm'))||0}).eq('id',sel));await boot(me)}
  else if(a==='addDeal'){
    var st=val('ds'),rs=val('dr'),cu=val('dc'),am=+val('da')||0;
    if(!cu){err='Enter the customer name.';render();return}
    if(st==='closed'&&am<=0){err='Enter the sale amount for a closed sale.';render();return}
    if(st!=='closed'&&!rs){err='Please write the reason the sale was not closed.';render();return}
    var row={employee_id:sel,customer:cu,model:val('dm'),amount:st==='closed'?am:0,status:st,reason:rs||null,deal_date:val('dd')||ymd(new Date())};
    ['dc','dm','da','dr'].forEach(clr);fail(await sb.from('deals').insert(row));load()}
  else if(a==='close'){var v=+val('am_'+t.dataset.id)||0;if(v<=0){err='Enter the sale amount first.';render();return}
    fail(await sb.from('deals').update({status:'closed',amount:v,deal_date:ymd(new Date())}).eq('id',t.dataset.id));load()}
  else if(a==='addNote'){var n=val('nt');if(n){clr('nt');fail(await sb.from('notes').insert({employee_id:sel,text:n}));load()}}
});
document.addEventListener('change',async function(ev){
  var t=ev.target;if(t.dataset&&t.dataset.a==='pct'){fail(await sb.from('goals').update({pct:+t.value}).eq('id',t.dataset.id));load()}
});
</script>
